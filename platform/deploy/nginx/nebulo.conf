# Main application: https://www.example.com  (replace server names and paths)
# Game files are served from a SEPARATE origin below so game code never shares the app origin.

limit_req_zone $binary_remote_addr zone=nebulo_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/nebulo/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 210m;   # admin game package uploads (MAX_GAME_PACKAGE_KB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Fingerprinted build assets: cache for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /storage/ {
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }

    # Game files live on the games origin. Keep them reachable here only if GAMES_ORIGIN is empty.
    location ~ ^/(games|game-files|vendor/ruffle)/ {
        include /etc/nginx/snippets/nebulo-game-files.conf;
    }

    location /api/ {
        limit_req zone=nebulo_api burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-nebulo.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}

# Games origin: static files only. Example: https://play.example-games.net
server {
    listen 80;
    listen [::]:80;
    server_name play.example-games.net;
    return 301 https://play.example-games.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example-games.net;

    ssl_certificate     /etc/letsencrypt/live/play.example-games.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example-games.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/nebulo/current/public;

    location ~ ^/(games|game-files|vendor/ruffle)/ {
        include /etc/nginx/snippets/nebulo-game-files.conf;
    }

    # Ruffle and Unity wrapper documents are rendered by the app at /frame/{slug}.
    location /frame/ {
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-nebulo.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location / { return 404; }
}
