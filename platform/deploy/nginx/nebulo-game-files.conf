# /etc/nginx/snippets/nebulo-game-files.conf
# Sandboxed game frames have an opaque ("null") origin, so their fetches of game assets
# (JSON, WASM, audio) are cross-origin requests and need CORS.
location ~ \.(php|phtml|phar|pl|py|cgi|sh)$ { return 404; }
add_header Access-Control-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "public, max-age=86400";
# No `types {}` block here: one would REPLACE the server's MIME map, not extend it.
# The stock /etc/nginx/mime.types already maps js, html, css, wasm and swf; Unity
# .data/.unityweb files fall back to default_type (application/octet-stream).

# Unity pre-compressed builds. `types { }` + default_type sets the type of the
# uncompressed file; a location with its own add_header loses the outer ones, so
# they are repeated.
location ~ \.js\.br$ { types { } default_type application/javascript; add_header Content-Encoding br; add_header Access-Control-Allow-Origin "*" always; add_header Cross-Origin-Resource-Policy "cross-origin" always; add_header X-Content-Type-Options "nosniff" always; add_header Cache-Control "public, max-age=86400"; }
location ~ \.wasm\.br$ { types { } default_type application/wasm; add_header Content-Encoding br; add_header Access-Control-Allow-Origin "*" always; add_header Cross-Origin-Resource-Policy "cross-origin" always; add_header X-Content-Type-Options "nosniff" always; add_header Cache-Control "public, max-age=86400"; }
location ~ \.data\.br$ { types { } default_type application/octet-stream; add_header Content-Encoding br; add_header Access-Control-Allow-Origin "*" always; add_header Cross-Origin-Resource-Policy "cross-origin" always; add_header X-Content-Type-Options "nosniff" always; add_header Cache-Control "public, max-age=86400"; }
location ~ \.js\.gz$ { types { } default_type application/javascript; add_header Content-Encoding gzip; add_header Access-Control-Allow-Origin "*" always; add_header Cross-Origin-Resource-Policy "cross-origin" always; add_header X-Content-Type-Options "nosniff" always; add_header Cache-Control "public, max-age=86400"; }
location ~ \.wasm\.gz$ { types { } default_type application/wasm; add_header Content-Encoding gzip; add_header Access-Control-Allow-Origin "*" always; add_header Cross-Origin-Resource-Policy "cross-origin" always; add_header X-Content-Type-Options "nosniff" always; add_header Cache-Control "public, max-age=86400"; }
location ~ \.data\.gz$ { types { } default_type application/octet-stream; add_header Content-Encoding gzip; add_header Access-Control-Allow-Origin "*" always; add_header Cross-Origin-Resource-Policy "cross-origin" always; add_header X-Content-Type-Options "nosniff" always; add_header Cache-Control "public, max-age=86400"; }
try_files $uri =404;
