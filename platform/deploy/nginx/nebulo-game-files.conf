# /etc/nginx/snippets/nebulo-game-files.conf
# Sandboxed game frames have an opaque ("null") origin, so their fetches of game assets
# (JSON, WASM, audio) are cross-origin requests and need CORS.
location ~ \.(php|phtml|phar|pl|py|cgi|sh)$ { return 404; }
add_header Access-Control-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "public, max-age=86400";
types {
    application/wasm wasm;
    application/x-shockwave-flash swf;
    application/octet-stream data unityweb;
}
# Unity pre-compressed builds
location ~ \.(js|wasm|data)\.br$ {
    add_header Content-Encoding br;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/octet-stream;
}
location ~ \.(js|wasm|data)\.gz$ {
    add_header Content-Encoding gzip;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/octet-stream;
}
try_files $uri =404;
