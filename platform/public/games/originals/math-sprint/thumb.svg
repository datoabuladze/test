<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1850"/><stop offset="1" stop-color="#0b0d17"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#c062f5"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif" font-weight="900" fill="#7c5cff" opacity=".12" font-size="64">
    <text x="30" y="90">7</text><text x="560" y="110">÷</text><text x="80" y="420">+</text><text x="540" y="440">9</text><text x="300" y="60">×</text>
  </g>
  <rect x="60" y="44" width="520" height="18" rx="9" fill="#ffffff" opacity=".08"/>
  <rect x="60" y="44" width="360" height="18" rx="9" fill="url(#bar)"/>
  <text x="300" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="78" fill="#ffffff">8 × 7 =</text>
  <rect x="140" y="196" width="320" height="96" rx="22" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-width="3"/>
  <text x="300" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="68" fill="#22d3ee" filter="url(#glow)">56</text>
  <g filter="url(#glow)">
    <rect x="482" y="200" width="120" height="58" rx="18" fill="#f472b6" fill-opacity=".18" stroke="#f472b6" stroke-width="3"/>
    <text x="542" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="34" fill="#f472b6">×5</text>
  </g>
  <g font-family="system-ui,sans-serif" font-weight="800" font-size="30" fill="#ffffff" text-anchor="middle">
    <rect x="150" y="318" width="92" height="56" rx="14" fill="#ffffff" fill-opacity=".08"/><text x="196" y="357">1</text>
    <rect x="254" y="318" width="92" height="56" rx="14" fill="#ffffff" fill-opacity=".08"/><text x="300" y="357">2</text>
    <rect x="358" y="318" width="92" height="56" rx="14" fill="#ffffff" fill-opacity=".08"/><text x="404" y="357">3</text>
    <rect x="150" y="384" width="92" height="56" rx="14" fill="#ffffff" fill-opacity=".08"/><text x="196" y="423">4</text>
    <rect x="254" y="384" width="92" height="56" rx="14" fill="#7c5cff" fill-opacity=".55"/><text x="300" y="423">5</text>
    <rect x="358" y="384" width="92" height="56" rx="14" fill="url(#ok)"/><text x="404" y="423" font-size="24">OK</text>
  </g>
  <text x="60" y="250" font-family="system-ui,sans-serif" font-weight="900" font-size="36" fill="#fde047" filter="url(#glow)">+80</text>
</svg>
