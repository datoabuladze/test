<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d17"/><stop offset=".55" stop-color="#1d1240"/><stop offset="1" stop-color="#3a1642"/></linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22184a"/><stop offset="1" stop-color="#0f0b22"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="big" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="640" height="480" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7"><circle cx="50" cy="40" r="1.3"/><circle cx="160" cy="80" r="1"/><circle cx="300" cy="30" r="1.5"/><circle cx="420" cy="70" r="1"/><circle cx="380" cy="140" r="1.2"/><circle cx="90" cy="150" r="1"/></g>
  <circle cx="500" cy="110" r="62" fill="#f472b6" opacity=".55" filter="url(#big)"/>
  <circle cx="500" cy="110" r="50" fill="#f9a8d4"/>
  <g stroke="#1d1240" stroke-opacity=".5" stroke-width="5"><path d="M448 116h104M450 130h100M456 144h88"/></g>
