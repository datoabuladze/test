  <path d="M110 330 Q170 300 228 236" stroke="#22d3ee" stroke-opacity=".3" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- bot -->
  <g transform="translate(240 222) rotate(-12)">
    <path d="M-20 -4 Q-34 -12 -48 -2" stroke="#f472b6" stroke-width="5" fill="none" stroke-linecap="round"/>
