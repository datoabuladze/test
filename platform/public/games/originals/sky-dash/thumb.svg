    <path d="M-8 20 L-14 32 M8 20 L16 30" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g stroke="#fff" stroke-opacity=".35" stroke-width="2"><path d="M40 110h70M20 190h50M560 400h60"/></g>
