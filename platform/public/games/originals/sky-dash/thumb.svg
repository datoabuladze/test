  <g fill="#7c5cff" opacity=".55"><rect x="32" y="250" width="6" height="8"/><rect x="60" y="280" width="6" height="8"/><rect x="134" y="214" width="6" height="8"/><rect x="156" y="260" width="6" height="8"/><rect x="226" y="270" width="6" height="8"/><rect x="262" y="300" width="6" height="8"/><rect x="344" y="232" width="6" height="8"/><rect x="434" y="262" width="6" height="8"/><rect x="560" y="226" width="6" height="8"/><rect x="584" y="270" width="6" height="8"/></g>
  <!-- rooftops -->
  <rect x="0" y="380" width="250" height="100" fill="url(#roof)"/>
  <rect x="390" y="350" width="250" height="130" fill="url(#roof)"/>
  <g filter="url(#glow)" fill="#22d3ee"><rect x="0" y="378" width="250" height="5"/><rect x="390" y="348" width="250" height="5"/></g>
  <rect x="270" y="290" width="100" height="10" fill="#3b2a7a"/><rect x="270" y="288" width="100" height="4" fill="#f472b6" filter="url(#glow)"/>
  <!-- spikes -->
  <path d="M170 380 L180 354 L190 380 L200 354 L210 380Z" fill="#f472b6" filter="url(#glow)"/>
  <!-- crate -->
  <rect x="500" y="300" width="50" height="50" rx="5" fill="#2b1d55" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
  <path d="M507 307 L543 343 M543 307 L507 343" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/>
  <!-- gems arc -->
  <g fill="#f9a8d4" filter="url(#glow)"><path d="M300 238 l10 11 -10 13 -10 -13z"/><path d="M340 222 l10 11 -10 13 -10 -13z"/><path d="M380 238 l10 11 -10 13 -10 -13z"/></g>
