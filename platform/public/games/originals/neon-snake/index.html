<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Snake</title>
<link rel="stylesheet" href="../_sdk/sdk.css">
<style>
  #ng-stage canvas { border-radius: 14px; box-shadow: 0 30px 80px -30px rgba(124,92,255,.55); }
  .ns-pad { display: grid !important; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 8px; }
  .ns-pad button { width: 60px; height: 60px; }
  .ns-pad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  .ns-pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  .ns-pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
  .ns-pad button:nth-child(4) { grid-column: 3; grid-row: 2; }
  @media (hover: hover) and (pointer: fine) { .ns-pad.ng-auto { display: none !important; } }
</style>
</head>
<body>
<script src="../_sdk/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
