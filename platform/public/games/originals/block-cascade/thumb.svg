  <g fill="url(#o)"><use href="#b" x="284" y="386" width="36" height="36"/><use href="#b" x="320" y="386" width="36" height="36"/><use href="#b" x="356" y="386" width="36" height="36"/><use href="#b" x="392" y="386" width="36" height="36"/></g>
