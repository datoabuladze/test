<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sudoku Zen</title>
<link rel="stylesheet" href="../_sdk/sdk.css">
<style>
  #ng-stage { background: radial-gradient(110% 80% at 50% 0%, #0f2a3a 0%, #0b0d17 62%); }
  #sz-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: var(--gap, 18px); padding: 12px; }
  #sz-wrap.port { flex-direction: column; }
  #sz-board { position: relative; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
    border-radius: 14px; overflow: hidden; background: #131a2b; border: 2px solid rgba(34,211,238,.55);
    box-shadow: 0 0 0 1px rgba(124,92,255,.25), 0 30px 80px -30px rgba(34,211,238,.45); transition: filter .25s; flex: 0 0 auto; }
  #sz-board.blur, #sz-pad.blur { filter: blur(14px) brightness(.5); }
  .sz-cell { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer;
    border-right: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07);
    color: #7dd3fc; font-weight: 700; font-variant-numeric: tabular-nums; transition: background .12s; touch-action: manipulation; }
  .sz-cell.c2, .sz-cell.c5 { border-right: 2px solid rgba(34,211,238,.45); }
  .sz-cell.r2, .sz-cell.r5 { border-bottom: 2px solid rgba(34,211,238,.45); }
  .sz-cell.alt { background: rgba(124,92,255,.06); }
  .sz-cell.given { color: #eef0ff; font-weight: 800; }
  .sz-cell.peer { background: rgba(34,211,238,.08); }
  .sz-cell.same { background: rgba(124,92,255,.32); }
  .sz-cell.sel { background: rgba(34,211,238,.32); box-shadow: inset 0 0 0 2px #22d3ee; }
  .sz-cell.bad { color: #fb7185; background: rgba(244,63,94,.18); }
  .sz-cell.given.bad { color: #fecdd3; }
  .sz-cell.flash { animation: sz-flash .6s ease-out; }
  .sz-cell.pop .sz-v { animation: sz-pop .22s ease-out; }
  @keyframes sz-flash { 0% { background: rgba(244,114,182,.0); } 30% { background: rgba(244,114,182,.45); } 100% { background: rgba(244,114,182,0); } }
  @keyframes sz-pop { from { transform: scale(.4); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  .sz-notes { position: absolute; inset: 6%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    color: #a5b4fc; font-weight: 700; line-height: 1; }
  .sz-notes span { display: flex; align-items: center; justify-content: center; }
  .sz-notes span.hl { color: #fde047; }
  #sz-pad { display: grid; gap: 8px; flex: 0 0 auto; transition: filter .25s; }
  #sz-pad button { border: 1px solid rgba(255,255,255,.12); border-radius: 12px; background: rgba(255,255,255,.06); cursor: pointer;
    font-weight: 800; position: relative; padding: 0; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #sz-pad button:hover { background: rgba(255,255,255,.12); }
  #sz-pad button:active { transform: scale(.95); }
  #sz-pad button.dig { color: #eef0ff; }
  #sz-pad button.dig small { font-size: 10px; font-weight: 600; color: #8b90b3; margin-top: 1px; }
  #sz-pad button.done { opacity: .3; }
  #sz-pad button.tool { color: #b4b9d6; font-size: 12px; }
  #sz-pad button.tool svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 2px; }
  #sz-pad button.tool.on { color: #0b0d17; background: linear-gradient(135deg, #22d3ee, #7c5cff); border-color: transparent; }
  .xx-diff { margin-top: 12px; }
  .xx-diff-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b90b3; margin-bottom: 6px; }
  .xx-diff-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .xx-chip { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 13px; }
  .xx-chip.on { background: linear-gradient(135deg, rgba(34,211,238,.35), rgba(124,92,255,.45)); border-color: #22d3ee; }
  @media (max-width: 520px) { #ng-hud .ng-stats { gap: 8px; font-size: 12px; } #ng-hud .ng-title { font-size: 14px; } #ng-hud { gap: 6px; padding: 6px 8px; } #ng-hud .ng-btn { width: 30px; height: 30px; flex: 0 0 auto; } }
  @media (max-width: 440px) { #ng-hud .ng-title { display: none; } #ng-hud .ng-stats { gap: 7px; font-size: 11.5px; } }
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<script src="../_sdk/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
