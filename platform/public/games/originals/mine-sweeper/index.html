<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mine Field</title>
<link rel="stylesheet" href="../_sdk/sdk.css">
<style>
  #ng-stage { background: radial-gradient(120% 90% at 50% 0%, #2a1030 0%, #0b0d17 62%); }
  #ms-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px; }
  #ms-board { border-radius: 12px; box-shadow: 0 0 0 1px rgba(244,114,182,.35), 0 30px 80px -30px rgba(244,114,182,.5); transition: filter .25s; cursor: pointer; }
  #ms-board.blur { filter: blur(14px) brightness(.5); }
  #ms-board.shake { animation: ms-shake .45s ease; }
  @keyframes ms-shake { 0%,100% { translate: 0 0; } 20% { translate: -7px 3px; } 40% { translate: 6px -4px; } 60% { translate: -4px 2px; } 80% { translate: 3px -1px; } }
  #ms-bar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .ms-seg { display: inline-flex; border-radius: 14px; padding: 3px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .ms-seg button { border: 0; background: transparent; border-radius: 11px; padding: 8px 16px; font-weight: 800; font-size: 14px; cursor: pointer; color: #b4b9d6; display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation; }
  .ms-seg button svg { width: 18px; height: 18px; }
  .ms-seg button.on { color: #fff; background: linear-gradient(135deg, #f472b6, #7c5cff); box-shadow: 0 6px 18px -8px #f472b6; }
  .ms-left { font-weight: 800; font-variant-numeric: tabular-nums; color: #f472b6; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 12px; background: rgba(244,114,182,.1); border: 1px solid rgba(244,114,182,.3); }
  .ms-left svg { width: 18px; height: 18px; }
  .xx-diff { margin-top: 12px; }
  .xx-diff-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b90b3; margin-bottom: 6px; }
  .xx-diff-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .xx-chip { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 13px; }
  .xx-chip.on { background: linear-gradient(135deg, rgba(244,114,182,.35), rgba(124,92,255,.45)); border-color: #f472b6; }
  @media (max-width: 520px) { #ng-hud .ng-stats { gap: 8px; font-size: 12px; } #ng-hud .ng-title { font-size: 14px; } #ng-hud { gap: 6px; padding: 6px 8px; } #ng-hud .ng-btn { width: 30px; height: 30px; flex: 0 0 auto; } }
  @media (max-width: 440px) { #ng-hud .ng-title { display: none; } #ng-hud .ng-stats { gap: 7px; font-size: 11.5px; } }
</style>
</head>
<body>
<script src="../_sdk/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
