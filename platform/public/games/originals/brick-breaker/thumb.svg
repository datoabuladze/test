    <g fill="#fb923c"><rect x="40" y="92" width="62" height="26" rx="7"/><rect x="108" y="92" width="62" height="26" rx="7"/><rect x="176" y="92" width="62" height="26" rx="7"/><rect x="380" y="92" width="62" height="26" rx="7"/><rect x="448" y="92" width="62" height="26" rx="7"/><rect x="516" y="92" width="62" height="26" rx="7"/></g>
    <g fill="#fbbf24"><rect x="40" y="124" width="62" height="26" rx="7"/><rect x="108" y="124" width="62" height="26" rx="7"/><rect x="448" y="124" width="62" height="26" rx="7"/><rect x="516" y="124" width="62" height="26" rx="7"/></g>
    <g fill="#34d399"><rect x="40" y="156" width="62" height="26" rx="7"/><rect x="516" y="156" width="62" height="26" rx="7"/></g>
    <rect x="244" y="92" width="62" height="26" rx="7" fill="#ef4444"/>
    <g fill="#22d3ee"><rect x="176" y="124" width="62" height="26" rx="7" opacity=".7"/></g>
  </g>
  <g fill="#fff" fill-opacity=".3"><rect x="46" y="64" width="50" height="6" rx="3"/><rect x="114" y="64" width="50" height="6" rx="3"/><rect x="182" y="64" width="50" height="6" rx="3"/><rect x="250" y="64" width="50" height="6" rx="3"/><rect x="318" y="64" width="50" height="6" rx="3"/><rect x="386" y="64" width="50" height="6" rx="3"/><rect x="454" y="64" width="50" height="6" rx="3"/><rect x="522" y="64" width="50" height="6" rx="3"/></g>
