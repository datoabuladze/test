<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#12305a"/><stop offset=".6" stop-color="#0d1426"/><stop offset="1" stop-color="#0b0d17"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d17"/><stop offset=".62" stop-color="#3b1d5e"/><stop offset="1" stop-color="#0b0d17"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="pic"><rect width="300" height="300"/></clipPath>
    <!-- the picture, drawn once and reused per tile -->
    <g id="art">
      <rect width="300" height="300" fill="url(#sky)"/>
      <g fill="#fff" opacity=".8"><circle cx="30" cy="30" r="1.5"/><circle cx="90" cy="60" r="1"/><circle cx="250" cy="40" r="1.6"/><circle cx="200" cy="20" r="1"/><circle cx="140" cy="35" r="1.2"/></g>
      <circle cx="150" cy="140" r="62" fill="#f472b6" filter="url(#glow)" opacity=".7"/>
      <circle cx="150" cy="140" r="60" fill="url(#sun)"/>
      <g fill="#3b1d5e"><rect x="88" y="150" width="124" height="4"/><rect x="88" y="163" width="124" height="5"/><rect x="88" y="177" width="124" height="7"/><rect x="88" y="192" width="124" height="8"/></g>
      <path d="M0 210 L40 170 L70 190 L110 150 L150 195 L190 160 L230 185 L265 155 L300 180 V300 H0z" fill="#1c1240"/>
      <path d="M0 225 L50 195 L95 215 L140 190 L185 220 L235 195 L300 215 V300 H0z" fill="#140d30"/>
      <rect y="225" width="300" height="75" fill="#0b0d17"/>
      <g stroke="#f472b6" stroke-width="1.5" opacity=".9">
        <path d="M150 225 L150 300M130 225 L70 300M170 225 L230 300M110 225 L-10 300M190 225 L310 300M90 225 L-90 300M210 225 L390 300"/>
        <path d="M0 232 H300M0 244 H300M0 262 H300M0 288 H300"/>
      </g>
    </g>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g transform="translate(170 70)">
    <rect x="-12" y="-12" width="324" height="324" rx="22" fill="#141829" stroke="#22d3ee" stroke-opacity=".3" stroke-width="2"/>
    <!-- 3x3 tiles, 96px + 6px gaps; tiles placed from picture slices, one swapped and the last one missing -->
    <svg x="0" y="0" width="96" height="96" viewBox="0 0 100 100"><use href="#art"/></svg>
    <svg x="102" y="0" width="96" height="96" viewBox="100 0 100 100"><use href="#art"/></svg>
    <svg x="204" y="0" width="96" height="96" viewBox="200 0 100 100"><use href="#art"/></svg>
    <svg x="0" y="102" width="96" height="96" viewBox="0 100 100 100"><use href="#art"/></svg>
    <svg x="102" y="102" width="96" height="96" viewBox="200 100 100 100"><use href="#art"/></svg>
    <svg x="204" y="102" width="96" height="96" viewBox="100 100 100 100"><use href="#art"/></svg>
    <svg x="0" y="204" width="96" height="96" viewBox="0 200 100 100"><use href="#art"/></svg>
    <svg x="102" y="204" width="96" height="96" viewBox="100 200 100 100"><use href="#art"/></svg>
    <g fill="none" stroke="#0b0d17" stroke-width="6">
      <rect x="-1" y="-1" width="98" height="98" rx="12"/><rect x="101" y="-1" width="98" height="98" rx="12"/><rect x="203" y="-1" width="98" height="98" rx="12"/>
      <rect x="-1" y="101" width="98" height="98" rx="12"/><rect x="101" y="101" width="98" height="98" rx="12"/><rect x="203" y="101" width="98" height="98" rx="12"/>
      <rect x="-1" y="203" width="98" height="98" rx="12"/><rect x="101" y="203" width="98" height="98" rx="12"/>
    </g>
    <rect x="204" y="204" width="96" height="96" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
  <!-- the floating missing tile -->
  <g transform="translate(470 300) rotate(12)">
    <rect x="-6" y="-6" width="108" height="108" rx="16" fill="#22d3ee" opacity=".35" filter="url(#glow)"/>
    <svg x="0" y="0" width="96" height="96" viewBox="200 200 100 100"><use href="#art"/></svg>
    <rect x="0" y="0" width="96" height="96" rx="12" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  </g>
  <text x="320" y="452" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="38" fill="#fff" letter-spacing="2">TILE DRIFT</text>
</svg>
