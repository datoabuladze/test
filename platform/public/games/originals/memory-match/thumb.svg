<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="10%" r="95%"><stop offset="0" stop-color="#2d1b69"/><stop offset=".55" stop-color="#130f2e"/><stop offset="1" stop-color="#0b0d17"/></radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a7a"/><stop offset="1" stop-color="#191338"/></linearGradient>
    <radialGradient id="faceY" cx="50%" cy="40%"><stop offset="0" stop-color="#fde047" stop-opacity=".35"/><stop offset=".75" stop-color="#141830"/></radialGradient>
    <radialGradient id="faceP" cx="50%" cy="40%"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset=".75" stop-color="#141830"/></radialGradient>
    <radialGradient id="faceC" cx="50%" cy="40%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset=".75" stop-color="#141830"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="cardback">
      <rect width="104" height="124" rx="15" fill="url(#back)" stroke="#7c5cff" stroke-opacity=".6" stroke-width="2"/>
      <rect x="8" y="8" width="88" height="108" rx="11" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="4 4"/>
      <ellipse cx="52" cy="62" rx="32" ry="12" fill="none" stroke="#f472b6" stroke-opacity=".6" stroke-width="2.5" transform="rotate(-24 52 62)"/>
      <circle cx="52" cy="62" r="11" fill="#22d3ee" fill-opacity=".35"/>
    </g>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g fill="#fff" opacity=".55"><circle cx="60" cy="50" r="1.6"/><circle cx="590" cy="70" r="2"/><circle cx="610" cy="420" r="1.4"/><circle cx="30" cy="300" r="1.8"/><circle cx="350" cy="28" r="1.2"/><circle cx="500" cy="450" r="1.5"/></g>
  <!-- back row of cards -->
  <use href="#cardback" x="86" y="60" transform="rotate(-8 138 122)"/>
  <use href="#cardback" x="450" y="60" transform="rotate(8 502 122)"/>
  <use href="#cardback" x="86" y="300" transform="rotate(6 138 362)" opacity=".9"/>
  <use href="#cardback" x="450" y="300" transform="rotate(-6 502 362)" opacity=".9"/>
  <!-- matched pair: stars -->
  <g transform="rotate(-10 245 200)">
    <rect x="186" y="128" width="118" height="140" rx="17" fill="#fde047" opacity=".45" filter="url(#glow)"/>
    <rect x="186" y="128" width="118" height="140" rx="17" fill="url(#faceY)" stroke="#fde047" stroke-width="2.5"/>
    <path transform="translate(212 165) scale(1.0)" fill="#fde047" d="M32 6l7.6 16.4 17.9 2.1-13.2 12.2 3.5 17.7L32 45.6 16.2 54.4l3.5-17.7L6.5 24.5l17.9-2.1z"/>
  </g>
  <g transform="rotate(10 395 200)">
    <rect x="336" y="128" width="118" height="140" rx="17" fill="#fde047" opacity=".45" filter="url(#glow)"/>
    <rect x="336" y="128" width="118" height="140" rx="17" fill="url(#faceY)" stroke="#fde047" stroke-width="2.5"/>
    <path transform="translate(362 165)" fill="#fde047" d="M32 6l7.6 16.4 17.9 2.1-13.2 12.2 3.5 17.7L32 45.6 16.2 54.4l3.5-17.7L6.5 24.5l17.9-2.1z"/>
  </g>
  <!-- open cards: heart and bolt -->
  <g transform="rotate(-4 262 350)">
    <rect x="210" y="290" width="104" height="124" rx="15" fill="url(#faceP)" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
    <path transform="translate(230 320)" fill="#fb7185" d="M32 56S7 41 7 23a12.5 12.5 0 0 1 25-4 12.5 12.5 0 0 1 25 4c0 18-25 33-25 33z"/>
  </g>
  <g transform="rotate(4 378 350)">
    <rect x="326" y="290" width="104" height="124" rx="15" fill="url(#faceC)" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
    <path transform="translate(346 320)" fill="#22d3ee" d="M37 4L12 36h16l-4 24 26-34H34z"/>
  </g>
  <!-- sparkles -->
  <g fill="#fde047"><circle cx="320" cy="110" r="4"/><circle cx="296" cy="96" r="2.5"/><circle cx="350" cy="92" r="2"/></g>
  <g fill="#22d3ee"><circle cx="170" cy="118" r="2.5"/><circle cx="476" cy="270" r="3"/></g>
  <text x="320" y="462" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="34" fill="#fff" letter-spacing="1">NEON PAIRS</text>
</svg>
