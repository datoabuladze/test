<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Pairs</title>
<link rel="stylesheet" href="../_sdk/sdk.css">
<style>
  #ng-stage { background: radial-gradient(120% 90% at 50% 0%, #1a1440 0%, #0b0d17 60%); }
  #mm-board { position: relative; transition: filter .25s; }
  #mm-board.blur { filter: blur(14px) brightness(.6); }
  .mm-card { position: absolute; perspective: 700px; cursor: pointer; touch-action: manipulation; }
  .mm-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .32s cubic-bezier(.3,.7,.3,1.2); }
  .mm-card.up .mm-inner { transform: rotateY(180deg); }
  .mm-side { position: absolute; inset: 0; border-radius: 14%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .mm-back { background:
      radial-gradient(circle at 50% 50%, rgba(34,211,238,.22) 0 18%, transparent 19%),
      radial-gradient(circle at 30% 20%, #3a2a7a, #191338 70%);
    border: 1px solid rgba(124,92,255,.45); box-shadow: inset 0 0 0 3px rgba(255,255,255,.03), 0 8px 18px -10px rgba(0,0,0,.8); }
  .mm-back::before { content: ''; position: absolute; width: 62%; height: 26%; border: 2px solid rgba(244,114,182,.55); border-radius: 50%; transform: rotate(-24deg); }
  .mm-back::after { content: ''; position: absolute; inset: 7%; border-radius: 11%; border: 1px dashed rgba(255,255,255,.12); }
  .mm-card:hover .mm-back { border-color: rgba(34,211,238,.8); }
  .mm-face { transform: rotateY(180deg); background: radial-gradient(circle at 50% 40%, var(--glow), #141830 72%);
    border: 1px solid rgba(255,255,255,.14); }
  .mm-face svg { width: 66%; height: 66%; filter: drop-shadow(0 0 8px var(--glow)); }
  .mm-card.matched .mm-face { border-color: var(--c); box-shadow: 0 0 18px -2px var(--c); animation: mm-pop .45s ease-out; }
  .mm-card.matched { cursor: default; }
  .mm-card.miss .mm-face { animation: mm-shake .35s ease; border-color: #f87171; }
  .mm-card.kb .mm-side { outline: 3px solid #22d3ee; outline-offset: 3px; }
  @keyframes mm-pop { 0% { transform: rotateY(180deg) scale(1); } 45% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(1); } }
  @keyframes mm-shake { 0%,100% { translate: 0; } 25% { translate: -5px; } 75% { translate: 5px; } }
  .xx-diff { margin-top: 12px; }
  .xx-diff-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b90b3; margin-bottom: 6px; }
  .xx-diff-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .xx-chip { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 13px; }
  .xx-chip.on { background: linear-gradient(135deg, rgba(34,211,238,.35), rgba(124,92,255,.45)); border-color: #22d3ee; }
  .xx-stars { font-size: 30px; letter-spacing: 6px; color: #fde047; text-shadow: 0 0 14px rgba(253,224,71,.6); }
  @media (max-width: 520px) { #ng-hud .ng-stats { gap: 8px; font-size: 12px; } #ng-hud .ng-title { font-size: 14px; } #ng-hud { gap: 6px; padding: 6px 8px; } #ng-hud .ng-btn { width: 30px; height: 30px; } }
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<script src="../_sdk/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
